name: Release

# Two ways to cut a release:
#   1. Actions → Release → "Run workflow", enter a version (e.g. 0.2.0). The workflow bumps
#      Cargo.toml, commits, tags vX.Y.Z, builds and publishes.
#   2. Bump the version yourself, then push a tag: git tag v0.2.0 && git push origin v0.2.0
# The app's updater reads the latest published release and its two assets.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Bump version, commit and tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          v="${{ inputs.version }}"
          v="${v#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$v'"; exit 1
          fi
          if git rev-parse "v$v" >/dev/null 2>&1; then
            echo "::error::Tag v$v already exists"; exit 1
          fi
          # The first `version =` line is [workspace.package]; every crate inherits it.
          sed -i "0,/^version = \".*\"/s//version = \"$v\"/" Cargo.toml
          cargo update --workspace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Cargo.toml is already at $v"
          else
            git commit -am "Release v$v"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          git tag "v$v"
          git push origin "v$v"
          echo "TAG=v$v" >> "$GITHUB_ENV"

      - name: Use pushed tag
        if: github.event_name == 'push'
        shell: bash
        run: echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Check Cargo version matches tag
        shell: bash
        run: |
          v=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v$v" != "$TAG" ]; then
            echo "::error::Cargo.toml says $v but the tag is $TAG. Bump the version before tagging."; exit 1
          fi

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release -p cm-app

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/claude-manager.exe dist/claude-manager.exe
          $hash = (Get-FileHash dist/claude-manager.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/claude-manager.exe.sha256 -Value "$hash  claude-manager.exe" -NoNewline -Encoding ascii
          Get-Content dist/claude-manager.exe.sha256

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $v = $env:TAG.TrimStart('v')
          & $iscc "/DAppVersion=$v" "/DSourceExe=..\target\release\claude-manager.exe" installer\claude-manager.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      # Unsigned Store package; Partner Center signs it on submission. Identity values come from
      # Partner Center → Product identity. Uploaded as a workflow artifact, not a release asset,
      # because an unsigned .msix can't be installed directly.
      - name: Build Store package
        shell: pwsh
        run: |
          .\packaging\msix\build.ps1 -Exe target\release\claude-manager.exe -Version $env:TAG -Pack `
            -IdentityName "Yarrel.ClaudeManager" `
            -Publisher "CN=15C8B9FC-3B66-4BCE-8F4E-9089B62DD74C" `
            -PublisherDisplayName "Yarrel" -OutDir store -LayoutDir target/msix-store

      - uses: actions/upload-artifact@v4
        with:
          name: store-package
          path: store/*.msix

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Claude Manager ${{ env.TAG }}
          generate_release_notes: true
          files: |
            dist/ClaudeManager-Setup-*.exe
            dist/claude-manager.exe
            dist/claude-manager.exe.sha256
