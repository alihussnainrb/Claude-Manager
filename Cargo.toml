[workspace]
resolver = "3"
members = ["crates/cm-core", "crates/cm-win", "crates/cm-app"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"

[workspace.dependencies]
cm-core = { path = "crates/cm-core" }
cm-win = { path = "crates/cm-win" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
async-channel = "2"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
